function cleanProgress(p){

 for(const group of ['completed','checks','notes']){
  if(!object(p[group]))continue;
  for(const [key,val] of Object.entries(p[group])){
   if(!/^(common|role:[a-z0-9-]+|[a-z0-9-]+):[a-z0-9-]+$/.test(key))continue;
   if(group==='completed'&&typeof val==='boolean')out[group][key]=val;
   if(group==='notes'&&typeof val==='string')out[group][key]=val.slice(0,20000);
   if(group==='checks'&&object(val)){out[group][key]={};for(const [k,v] of Object.entries(val))if(/^\d{1,2}$/.test(k)&&typeof v==='boolean')out[group][key][k]=v;}
  }
 }

}

 return `<section class="compare-head"><div class="eyebrow">COMPARE REAL ROLES</div><h1 class="hero-title">비슷해 보이는 이름,<br><em>다르게 하는 일.</em></h1><p class="hero-desc">관심 있는 직업을 최대 3개까지 비교해보세요. 목표·업무·결과물·준비 경로를 나란히 볼 수 있습니다.</p></section><div class="compare-picked">${items.map(r=>`<span class="compare-pick">${esc(r.name)}<button data-action="compare-remove" data-role="${r.id}" aria-label="${esc(r.name)} 비교에서 제거">×</button></span>`).join('')}</div><div class="compare-search-wrap"><label for="compare-choice" class="small-muted">비교할 직무</label><select id="compare-choice" aria-label="비교할 직무 선택"><option value="">직무를 선택하세요</option>${TRACKS.map(t=>`<optgroup label="${esc(t.name)}">${rolesFor(t.id).filter(r=>!career.compare.includes(r.id)).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</optgroup>`).join('')}</select><button class="btn secondary small" data-action="compare-selected">비교에 추가</button></div>${items.length?`<div class="compare-table-wrap"><table class="compare-table"><thead><tr><th scope="col">비교 기준</th>${items.map(r=>`<th scope="col"><div class="compare-track-name">${esc(r.name)}</div><div class="small-muted">${esc(r.en)}</div><button class="btn secondary small" data-action="job" data-role="${r.id}">직무 상세 →</button></th>`).join('')}</tr></thead><tbody>${fields.map(([label,fn])=>`<tr><th scope="row">${label}</th>${items.map(r=>`<td>${fn(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="no-results">궁금한 직업을 위 목록에서 고르거나 분야 탐색에서 비교에 담아주세요.</div>'}<div class="comparison-hint">제품 PM과 프로젝트 PM, 기술 제품 PM과 기술 프로그램 PM은 이름이 비슷해도 책임의 초점이 다릅니다. 반대로 PM과 PO처럼 회사에 따라 실제 역할이 겹치는 명칭도 있어요. 직함보다 공고의 업무를 읽어보세요.</div>`;
}
function renderSources(){const seen=new Set(),unique=Object.entries(SOURCES).filter(([k,s])=>{if(seen.has(s.url))return false;seen.add(s.url);return true;});return `<div class="eyebrow">SOURCES & HOW TO READ THIS MAP</div><h1 class="hero-title">직무 지도의 <em>설명 기준</em></h1><p class="hero-desc">공식 직무소개·기업 채용 목록·공공 직업 설명을 참고해 대표 업무를 요약했습니다. 준비 경로와 실습 제안은 이 사이트에서 구성한 예시입니다.</p><section class="panel source-method"><strong>이 지도에서 구분해서 볼 것</strong><p>직무 소개: 대표 업무·결과물을 이해하기 위한 요약입니다. 64개 항목에는 전문 직무와 유사 직무를 묶은 항목이 함께 있으며, 표준 직업 분류 전체를 뜻하지 않습니다.</p><p>채용 링크: 직무명·업무 범위를 직접 확인하는 참고 링크입니다. 실시간 채용 집계나 채용 추천 엔진이 아니며, 공고는 마감·변경될 수 있습니다.</p><p>진입 경로: 신입 지원 가능 여부를 판정한 것이 아닙니다. 개별 공고의 학력·연차·담당 범위·과제를 확인하기 위한 안내입니다.</p><p>학습·실습: 학습 순서와 포트폴리오는 제안입니다. 공인 자격·입사 필수 조건·취업 보장이 아닙니다. 기존 분야 커리큘럼은 탐색용으로 유지하고, 목표 직무를 고르면 직무별 경로로 전환됩니다.</p><p>연결선: 실선은 분류·학습 흐름, 점선은 공유 역량·협업 접점을 뜻합니다. 직무 간 자동 전직이나 승진을 의미하지 않습니다.</p><p>자료 범위: 국내 기업 공식 자료와 일부 해외 공공 직업 설명을 사용했습니다. 미국의 학위·연봉·전망을 국내 취업 조건에 그대로 적용하지 않습니다. 이 사이트에는 연봉·채용 확률 예측을 넣지 않았습니다.</p><p>저장: 계정·서버 동기화 없이 이 브라우저의 localStorage를 사용합니다. 브라우저 삭제·시크릿 모드·파일 경로 변경에 대비해 JSON 백업을 보관하세요.</p><strong>자료 확인일: 2026년 11월 7일</strong></section><div class="sources-grid">${unique.map(([k])=>sourceLink(k)).join('')}</div>`;}
function render(){const old=app.querySelector('#detail-rail')?.scrollTop||0;app.innerHTML=header()+`<div class="shell">${side()}<main class="workspace" id="main-content" tabindex="-1">${mobile()}${state.view==='map'?renderMap():state.view==='job'?renderJob():state.view==='path'?renderPath():state.view==='compare'?renderCompare():state.view==='favorites'?renderFavorites():renderSources()}${footer()}</main></div>`;if(state.view==='map')filterMap();if(state.view==='path'){const rail=document.getElementById('detail-rail');if(rail)rail.scrollTop=old;}}
function setDone(value){const s=currentSteps()[state.selected];progress.completed[s.key]=value;progress.checks[s.key]={};s.tasks.forEach((_,i)=>progress.checks[s.key][i]=value);store();render();notify(value?'학습 단계를 완료로 표시했어요.':'완료 표시를 취소했어요.');}
function selectStep(i){if(i<0||i>=currentSteps().length)return;state.selected=i;render();const rail=document.getElementById('detail-rail');if(rail){rail.scrollTop=0;if(innerWidth<=1080)rail.scrollIntoView({behavior:'smooth',block:'start'});}}
function exportData(){const data={format:'pathways-careers-v2',exportedAt:new Date().toISOString(),progress,career};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PATHWAYS-career-records-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('직무 목표·관심·학습 기록을 백업했어요.');}
function addCompare(id,open=true){if(!roleBy(id))return;if(!career.compare.includes(id)){if(career.compare.length>=3){if(open)navigate('#/compare');notify('최대 3개까지 비교할 수 있어요. 기존 직무의 ×를 눌러 교체하세요.');return;}career.compare.push(id);store();}if(open)navigate('#/compare');else render();}
function reset(){const r=currentRole(),t=trackBy(state.track);if(!confirm(`${r?r.name:t.name}의 전문 단계 기록과 메모를 초기화할까요?\n공통 기반과 다른 직무의 기록은 유지됩니다.`))return;currentSteps().filter(s=>s.phase!=='common').forEach(s=>{delete progress.completed[s.key];delete progress.checks[s.key];delete progress.notes[s.key];});store();state.selected=firstTodo(currentSteps());render();notify('선택한 경로의 기록을 초기화했어요.');}
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!app.contains(el))return;const a=el.dataset.action;
 if(a==='all'){e.preventDefault();state.query='';state.kind='all';state.interest='all';navigate('#/map');}
 else if(a==='nav'){if(el.dataset.view==='map'){state.query='';state.interest='all';navigate('#/map');}else if(el.dataset.view==='path')openPath(career.lastTrack,career.targets[career.lastTrack]);else navigate('#/'+el.dataset.view);}
 else if(a==='field'){state.query='';state.kind='all';navigate('#/map/'+el.dataset.track);}
 else if(a==='kind'){state.kind=el.dataset.kind;state.query='';if(state.view!=='map')navigate('#/map');else render();}
 else if(a==='interest'){state.interest=el.dataset.interest;render();app.querySelector(`[data-interest="${state.interest}"]`)?.focus();}
 else if(a==='subfield'){navigate('#/map/'+state.field+(el.dataset.sub==='all'?'':'/'+el.dataset.sub));}
 else if(a==='compare-toggle'){const id=el.dataset.role;if(career.compare.includes(id)){career.compare=career.compare.filter(v=>v!==id);store();render();}else{addCompare(id,false);notify(career.compare.includes(id)?'비교에 담았어요. 최대 3개를 함께 볼 수 있어요.':'비교 목록이 가득 찼어요. 직업 비교에서 하나를 빼주세요.');}}
 else if(a==='job')openRole(el.dataset.role);
 else if(a==='start-role')startRole(el.dataset.role);
 else if(a==='base-path')openPath(el.dataset.track);
 else if(a==='resume')openPath(career.lastTrack,career.targets[career.lastTrack]);
 else if(a==='favorite'){const id=el.dataset.role;career.favorites=career.favorites.includes(id)?career.favorites.filter(x=>x!==id):[...career.favorites,id];store();render();app.querySelector(`[data-action="favorite"][data-role="${id}"]`)?.focus({preventScroll:true});notify(career.favorites.includes(id)?'관심 직업에 저장했어요.':'관심 직업에서 해제했어요.');}
 else if(a==='compare-add')addCompare(el.dataset.role);
 else if(a==='compare-selected'){const v=document.getElementById('compare-choice')?.value;if(v)addCompare(v,false);else notify('비교할 직무를 선택하세요.');}
 else if(a==='compare-remove'){career.compare=career.compare.filter(x=>x!==el.dataset.role);store();render();}
 else if(a==='step')selectStep(Number(el.dataset.index));
 else if(a==='next'){if(state.selected===currentSteps().length-1){if(currentRole())openRole(state.role);else navigate('#/map/'+state.track);}else selectStep(state.selected+1);}
 else if(a==='toggle-done')setDone(!done(currentSteps()[state.selected].key));
 else if(a==='reset')reset();
 else if(a==='sources')navigate('#/sources');
 else if(a==='export')exportData();
 else if(a==='import')document.getElementById('import-file').click();
});
app.addEventListener('input',e=>{if(e.target.id==='job-search'){state.query=e.target.value;filterMap();}else if(e.target.id==='step-note'){const s=currentSteps()[state.selected];progress.notes[s.key]=e.target.value;store();}});
app.addEventListener('change',e=>{if(e.target.dataset.action==='task'){const s=currentSteps()[state.selected],i=Number(e.target.dataset.task);progress.checks[s.key]??={};progress.checks[s.key][i]=e.target.checked;progress.completed[s.key]=s.tasks.every((_,j)=>progress.checks[s.key][j]===true);store();render();}});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>3000000){notify('백업 파일 크기가 너무 커요.');return;}try{const d=JSON.parse(await file.text());if(!['pathways-careers-v2','pathways-cs-v1'].includes(d.format)||!object(d.progress))throw Error('invalid');const legacy=d.format==='pathways-cs-v1';if(!confirm(legacy?'이전 버전의 학습 기록을 합칠까요? 현재 직무별 기록과 목표는 유지됩니다.':'백업으로 현재 직무·학습 기록을 교체할까요?'))return;const p=cleanProgress(d.progress);if(legacy){for(const g of ['completed','checks','notes'])progress[g]={...progress[g],...p[g]};}else{progress=p;career=cleanCareer(d.career);}store();if(state.view==='path')state.selected=firstTodo(currentSteps());render();notify(legacy?'이전 학습 기록을 합쳤어요.':'직무·학습 기록을 불러왔어요.');}catch(err){notify('PATHWAYS에서 내보낸 올바른 JSON 백업 파일을 선택하세요.');}});
window.addEventListener('hashchange',()=>{if(location.hash==='#main-content')return;arriveAtRoute();});

function roleCard(r){const sub=subfieldForRole(r),saved=career.favorites.includes(r.id),compared=career.compare.includes(r.id);return `<article class="explore-role" data-role-card="${r.id}"><div class="role-card-top"><span class="role-category">${esc(sub.name)}</span><button class="save-role ${saved?'is-saved':''}" data-action="favorite" data-role="${r.id}" aria-label="${esc(r.name)} ${saved?'관심 해제':'관심 저장'}" aria-pressed="${saved}">${saved?'★':'☆'}</button></div><h3><a href="#/job/${r.id}">${esc(r.name)}</a></h3><p class="role-one-line">${esc(r.summary)}</p><dl class="role-snippet"><div><dt>하는 일</dt><dd>${esc(r.work[0])}</dd></div><div><dt>결과물</dt><dd>${esc(r.outputs[0])}</dd></div></dl><div class="role-card-bottom"><a href="#/job/${r.id}" class="text-action">자세히 알아보기 →</a><button class="compare-card ${compared?'is-compared':''}" data-action="compare-toggle" data-role="${r.id}" aria-pressed="${compared}" aria-label="${esc(r.name)} ${compared?'비교에서 빼기':'비교에 담기'}">${compared?'✓ 비교 담김':'+ 비교'}</button></div></article>`;}
function renderMap(){if(state.field!=='all')return renderField();return `<section class="explore-hero"><div class="explore-hero-copy"><div class="eyebrow">EXPLORE YOUR POSSIBILITIES</div><h1>컴퓨터공학에서,<br><em>나만의 방향</em>을 찾아요.</h1><p>무엇이 될 수 있을지 궁금하다면,<br>관심 분야부터 시작해 실제로 하는 일까지 살펴보세요.</p><div class="hero-facts"><span><b>12</b>개의 분야</span><span><b>64</b>개의 직업</span><span>다양하게 이어지는 길</span></div></div><div class="journey-visual" aria-label="관심 분야에서 세부 분야를 거쳐 직업을 탐색하는 흐름"><div class="journey-root"><span>나의 출발점</span><b>컴퓨터공학</b></div><div class="journey-line"></div><div class="journey-options"><span>소프트웨어</span><span class="chosen">AI · 데이터</span><span>정보보안</span></div><div class="journey-line"></div><div class="journey-destination"><small>예를 들어, 분석과 의사결정</small><b>데이터 분석가</b><span>숫자로 현상을 이해하는 일</span></div><div class="journey-caption">관심 분야 → 세부 분야 → 직업</div></div></section><section class="interest-section" aria-labelledby="interest-title"><div class="section-heading"><div><span class="section-kicker">01 · 관심에서 시작하기</span><h2 id="interest-title">어떤 일이 마음에 드나요?</h2></div><span class="soft-note">관련 분야를 가볍게 살펴보세요</span></div><div class="interest-list">${INTERESTS.map(x=>`<button class="interest-chip ${state.interest===x.id?'active':''}" data-action="interest" data-interest="${x.id}" aria-pressed="${state.interest===x.id}">${esc(x.label)}</button>`).join('')}</div></section><section class="browse-section"><div class="section-heading browse-heading"><div><span class="section-kicker">02 · 분야에서 직업으로</span><h2>어디부터 살펴볼까요?</h2></div><label class="explorer-search">${I('search')}<input id="job-search" type="search" aria-label="직업·업무·기술 검색" placeholder="직업·하는 일 검색  예: 앱, 데이터" value="${esc(state.query)}" autocomplete="off"></label></div><p id="map-count" class="result-status" role="status" aria-live="polite"></p><div id="field-grid" class="explore-grid">${TRACKS.map(fieldCard).join('')}</div><div id="explorer-search-results" hidden></div></section><section class="explore-tip"><span class="tip-symbol">↗</span><div><h2>한 가지 길만 있는 건 아니에요.</h2><p>같은 분야에서도 하는 일은 달라요. 직업을 눌러 업무와 결과물을 살펴보고, 궁금한 직업끼리 비교해보세요.</p></div><button class="btn outline" data-action="nav" data-view="compare">직업 비교하기 →</button></section>`;}
function filterMap(){if(state.field!=='all')return;const q=state.query.trim().toLocaleLowerCase(),interest=INTERESTS.find(i=>i.id===state.interest)||INTERESTS[0],tracks=interest.id==='all'?TRACKS.map(t=>t.id):interest.tracks;const grid=document.getElementById('field-grid'),results=document.getElementById('explorer-search-results'),count=document.getElementById('map-count');if(!grid||!results)return;grid.hidden=!!q;results.hidden=!q;grid.querySelectorAll('.explore-card').forEach(el=>el.hidden=!tracks.includes(el.dataset.track));if(q){const found=ROLES.filter(r=>tracks.includes(r.track)&&[r.name,r.en,r.summary,trackBy(r.track).name,subfieldForRole(r).name,...r.work,...r.skills].join(' ').toLocaleLowerCase().includes(q));count.textContent=`${interest.id==='all'?'전체 분야':'선택한 관심 분야'}에서 “${state.query.trim()}” 검색 · ${found.length}개 직업`;results.innerHTML=found.length?`<div class="role-card-grid">${found.map(roleCard).join('')}</div>`:`<div class="empty-state"><h3>아직 일치하는 직업을 찾지 못했어요.</h3><p>더 짧은 단어나 다른 업무로 검색해보세요.</p><button class="btn secondary" data-action="all">전체 분야 다시 보기</button></div>`;}else{count.textContent=interest.id==='all'?'12개 분야를 자유롭게 탐색해보세요.':`이 관심과 연결해 볼 ${tracks.length}개 분야 · 다른 분야도 언제든 살펴볼 수 있어요.`;results.innerHTML='';}}
function renderField(){const t=trackBy(state.field),m=EXPLORER[t.id],groups=subfieldsFor(t.id),shown=state.sub==='all'?groups:groups.filter(g=>g.id===state.sub);return `<nav class="job-breadcrumbs" aria-label="현재 위치"><button class="crumb-btn" data-action="all">전체 분야</button><span>›</span><span>${esc(t.name)}</span></nav><section class="field-intro"><div><span class="section-kicker">관심 분야 살펴보기</span><h1>${esc(t.name)}</h1><p>${esc(m.lead)}</p><div class="field-meta">${groups.length}개 세부 분야 <span>·</span> ${rolesFor(t.id).length}개 직업</div></div><div class="field-question"><span class="field-icon">${t.icon}</span><span>이 분야가 던지는 질문</span><b>${esc(m.question)}</b></div></section><div class="section-heading subfield-heading"><div><span class="section-kicker">세부 분야를 고르고, 하는 일을 살펴보세요</span><h2>이 안에는 어떤 길이 있을까요?</h2></div></div><nav class="subfield-tabs" aria-label="세부 분야"><button class="subfield-tab ${state.sub==='all'?'active':''}" data-action="subfield" data-sub="all" aria-pressed="${state.sub==='all'}">전체 <span>${rolesFor(t.id).length}</span></button>${groups.map(g=>`<button class="subfield-tab ${state.sub===g.id?'active':''}" data-action="subfield" data-sub="${g.id}" aria-pressed="${state.sub===g.id}">${esc(g.name)} <span>${g.roles.length}</span></button>`).join('')}</nav><div class="subfield-sections">${shown.map((g,i)=>`<section class="subfield-section" aria-labelledby="sub-${g.id}"><div class="subfield-description"><span class="subfield-number">${String(groups.indexOf(g)+1).padStart(2,'0')}</span><div><h2 id="sub-${g.id}">${esc(g.name)}</h2><p>${esc(g.summary)}</p></div><span class="subfield-count">${g.roles.length}개 직업</span></div><div class="role-card-grid">${g.roles.map(roleBy).map(roleCard).join('')}</div></section>`).join('')}</div><section class="related-fields"><h2>다른 분야와도 연결돼요</h2><p>비슷한 관심을 다른 관점에서 살펴보세요.</p><div>${m.neighbors.map(id=>`<button class="related-field" data-action="field" data-track="${id}"><span>${trackBy(id).icon}</span>${esc(trackBy(id).name)} ↗</button>`).join('')}</div></section><p class="taxonomy-note">세부 분야는 탐색을 돕기 위해 묶었어요. 직업의 경계와 책임은 회사·제품에 따라 겹칠 수 있어요.</p>${compareDock()}`;}
function compareDock(){return career.compare.length?`<div class="explorer-dock"><span><b>${career.compare.length}개</b> 직업을 담았어요 <small>최대 3개 비교</small></span><button class="btn primary" data-action="nav" data-view="compare">하는 일 비교하기 →</button></div>`:'';}
function renderFavorites(){return `<section class="saved-heading"><div class="eyebrow">MY CURIOSITY COLLECTION</div><h1>조금 더 궁금한 직업들</h1><p>지금 목표를 확정하지 않아도 좋아요. 관심 가는 일을 모아 살펴보세요.</p></section><p class="result-status">${career.favorites.length}개 관심 직업 · 이 브라우저에 저장됩니다.</p>${career.favorites.length?`<div class="role-card-grid">${career.favorites.map(roleBy).map(roleCard).join('')}</div>`:`<div class="empty-state"><span class="empty-star">☆</span><h2>어떤 일이 궁금한가요?</h2><p>분야를 살펴보다 마음에 드는 직업의 별을 눌러주세요.</p><button class="btn primary" data-action="all">분야 탐색하러 가기 →</button></div>`}${compareDock()}`;}
function renderJob(){const r=currentRole();if(!r)return renderMap();const t=trackBy(r.track),g=subfieldForRole(r),saved=career.favorites.includes(r.id),others=g.roles.filter(id=>id!==r.id).map(roleBy);return `<nav class="job-breadcrumbs" aria-label="현재 위치"><button class="crumb-btn" data-action="all">전체 분야</button><span>›</span><button class="crumb-btn" data-action="field" data-track="${t.id}">${esc(t.name)}</button><span>›</span><a href="#/map/${t.id}/${g.id}">${esc(g.name)}</a></nav><section class="career-hero"><div class="section-kicker">${esc(g.name)} · 직업 알아보기</div><h1>${esc(r.name)}</h1><p class="job-en">${esc(r.en)}</p><p class="career-summary">${esc(r.summary)}</p><div class="job-actions"><button class="btn primary" data-action="favorite" data-role="${r.id}" aria-pressed="${saved}">${saved?'★ 관심 직업 저장됨':'☆ 관심 직업으로 저장'}</button><button class="btn outline" data-action="compare-toggle" data-role="${r.id}" aria-pressed="${career.compare.includes(r.id)}">${career.compare.includes(r.id)?'✓ 비교에 담김':'+ 비교에 담기'}</button><a href="#/map/${t.id}/${g.id}" class="text-action">같은 세부 분야 보기 →</a></div></section><div class="job-detail-layout"><div class="job-main"><section class="job-section panel"><span class="section-kicker">01 · 실제 하는 일</span><h2>어떤 일을 하나요?</h2><div class="work-list">${r.work.map((w,i)=>`<div class="work-item"><span class="work-no">${String(i+1).padStart(2,'0')}</span><span>${esc(w)}</span></div>`).join('')}</div><p class="role-note">대표 업무를 요약했어요. 실제 책임과 범위는 회사마다 달라요.</p></section><section class="job-section panel"><span class="section-kicker">02 · 눈에 보이는 결과</span><h2>무엇을 만들어 내나요?</h2><div class="output-grid">${r.outputs.map(o=>`<div class="output-card"><small>업무 결과물</small>${esc(o)}</div>`).join('')}</div></section><section class="job-section panel"><span class="section-kicker">03 · 역할의 차이 알아보기</span><h2>${others.length?'같은 분야, 어떻게 다를까요?':'이웃한 직업도 살펴보세요'}</h2><div class="role-neighbor-list">${(others.length?others:r.related.map(roleBy).filter(Boolean)).map(x=>`<a href="#/job/${x.id}"><b>${esc(x.name)} <span>↗</span></b><p>${esc(x.summary)}</p></a>`).join('')}</div><p class="role-note">직함이 비슷해도 업무의 초점이 다를 수 있어요. 관심 있는 직업을 담아 비교해보세요.</p></section><section class="job-section panel"><span class="section-kicker">04 · 작게 경험해보기</span><h2>직접 해보며 알아볼 수도 있어요.</h2><div class="mini-case"><small>학습용 실습 제안</small>${esc(r.portfolio)}</div><p>이 일이 궁금해졌다면, 관련 역량과 학습 단계를 더 살펴보세요.</p><button class="btn secondary" data-action="start-role" data-role="${r.id}">이 직업의 학습 경로 보기 →</button></section></div><aside class="job-rail"><section class="rail-section panel"><h3>어떤 역량을 사용하나요?</h3><div class="tags">${r.skills.map(s=>`<span class="skill-tag">${esc(s)}</span>`).join('')}</div><details class="entry-disclosure"><summary>진입할 때 살펴볼 점</summary><p>${esc(r.entrynote)}</p><p class="role-note">현재 채용 여부나 지원 가능 여부는 개별 공고에서 확인해주세요.</p></details></section><section class="rail-section panel"><h3>함께 살펴볼 직업</h3>${r.related.map(relatedButton).join('')}${r.cross.length?`<div class="cross-fields">${r.cross.map(id=>`<button class="text-action" data-action="field" data-track="${id}">${esc(trackBy(id).name)} 분야 ↗</button>`).join('')}</div>`:''}</section><section class="rail-section panel"><h3>설명의 참고 자료</h3>${r.sources.map(sourceLink).join('')}<p class="official-note">공식 직무소개와 공고 예시를 참고한 요약입니다. 학습 제안은 별도로 구성했어요.</p><div class="source-meta">기존 자료 확인: 2026.11.07<br>이번 개편에서 원문을 재검증한 것은 아닙니다.</div></section></aside></div>${compareDock()}`;}

</script>
</body>
